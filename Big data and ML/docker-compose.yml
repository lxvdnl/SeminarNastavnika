networks:
  oilfield-net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  superset_home:

services:
  postgres:
    image: postgres:15
    container_name: oilfield-postgres
    environment:
      POSTGRES_DB: oilfield
      POSTGRES_USER: oilfield
      POSTGRES_PASSWORD: oilfield123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - oilfield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilfield -d oilfield"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: oilfield-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - oilfield-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: oilfield-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/oilfield &&
        echo 'Bucket oilfield created'
      "
    networks:
      - oilfield-net

  etl:
    build: ./etl
    container_name: oilfield-etl
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: oilfield
      PG_USER: oilfield
      PG_PASSWORD: oilfield123
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: oilfield
    networks:
      - oilfield-net
    restart: "no"

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: oilfield-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "oilfield"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: oilfield
      PG_USER: oilfield
      PG_PASSWORD: oilfield123
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: oilfield
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      - etl
    networks:
      - oilfield-net
    user: root
    command: >
      bash -c "
        pip install psycopg2-binary boto3 pyarrow s3fs --quiet &&
        start-notebook.sh --NotebookApp.token='oilfield' --NotebookApp.notebook_dir='/home/jovyan/work'
      "

  superset:
    image: apache/superset:4.1.1
    container_name: oilfield-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "superset_secret_oilfield_2024"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/init-superset.sh:/init-superset.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oilfield-net
    command: >
      bash -c "
        pip install psycopg2-binary --quiet &&
        chmod +x /init-superset.sh &&
        /init-superset.sh
      "
